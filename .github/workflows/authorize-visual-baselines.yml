name: Authorize visual regression baselines

# Lets CI itself author the visual-regression baseline PNGs under ui-audit/visual-baselines/
# (B1171504). WHY THIS EXISTS: the required `build` check's visual-regression gate
# (ui-audit/visual-regression.mjs --check, wired via .github/ci-gates.yml) compares every PR's
# rendered screenshots against those committed PNGs, and until now the ONLY way to produce them
# was a person running `--approve` on their own machine. A locally-rendered image does not
# byte-match what THIS runner (ubuntu-latest, GitHub Actions' own container image) renders, even
# with the exact CI-pinned Chromium revision — confirmed twice on this repo: B1096017's own
# recorded recurrence (re-approved locally with the pinned revision, shipped clean in that
# sandbox, failed the very next real CI run on all 16 surface/theme/viewport pairs) and PR #1426
# (an identical 0.29–2.72% signature against a 0.02% tolerance, twice, also captured with the
# pinned revision). Font hinting/antialiasing differ between a sandbox's container image and this
# runner's image below what any locally-available browser build can close. A value nobody can
# reproduce locally must never be a merge gate — so this workflow moves the AUTHORING step onto
# the only environment that can legitimately produce it: this one.
#
# WHAT THIS DOES NOT DO. It does not touch ui-audit/visual-regression.mjs's TOLERANCE, evaluateDiff,
# or the --check pass/fail path, or anything else the gate checks against — see this item's own
# BACKLOG.md entry for exactly what changed and what didn't. This workflow is an AUTHORING path,
# not a change to what "pass" means. The gate still runs, still measures, and still fails a real
# regression exactly as before (B1171504's own acceptance test proves this both ways).
#
# ⛔ MANUAL TRIGGER ONLY — never add push:/pull_request:/schedule: here. The one thing that makes
# CI-authored baselines trustworthy rather than a rubber stamp is that a human decides, on
# purpose, one time, that THIS render is the one to approve. Any trigger that fires on an
# ordinary push would silently turn every PR green by re-defining "correct" as "whatever was just
# pushed," which is the exact failure this whole gate exists to prevent.
#
# ⛔ MOVING THE RENDER TO CI DOES NOT REMOVE HUMAN TRIAGE — it relocates it. Locally-approved
# baselines have always relied on a person looking at the diff before trusting `--approve`; a CI
# render is no different in kind, but nobody is watching the job run, so the triage has to travel
# to where a human WILL look — the PR. Every run posts a comment (or, with no open PR, the job
# summary) listing EVERY surface/theme/viewport this run touched, changed or not, with its diff
# magnitude against the prior committed baseline (ui-audit/visual-regression.mjs's own
# `buildTriageMarkdown`). A baseline that changed on a surface the PR's own diff never touches is
# not noise to scroll past — it is exactly the signal that a change had a wider ripple than
# intended, and the reviewer sees it before merging, not after. This workflow never decides a diff
# is "fine" on its own; it only makes sure the full, honest list is somewhere a person will read it.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why these baselines are changing (mirrors the local --reason= requirement — recorded in the manifest + docs/VISUAL-REGRESSION.md)"
        required: true
        type: string
      surface:
        description: "Optional: limit to one surface id (dev convenience, matches --surface=). Leave blank for every surface."
        required: false
        type: string
      viewport:
        description: "Optional: limit to one viewport id, desktop or phone (matches --viewport=). Leave blank for both."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

# One authoring run per branch at a time; a second dispatch on the same branch supersedes the
# first (this operation is a pure function of the branch's own current code, so cancelling an
# in-flight run in favor of a newer dispatch loses nothing — unlike build.yml's main-branch
# carve-out, there is no "every run needs its own reported verdict" requirement here).
concurrency:
  group: authorize-visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      # ⛔ NEVER main. Baselines authored here still have to clear normal PR review + the gate
      # itself before merging anywhere — this refusal is what keeps that true. Dispatching against
      # main would let a picture become "correct" with no PR, no diff, no reviewer ever seeing it.
      - name: Refuse to run against main
        if: github.ref == 'refs/heads/main' || github.ref_name == 'main'
        run: |
          echo "::error::authorize-visual-baselines must never run against main — dispatch it against the PR branch that needs new baselines, then let the normal PR review + build check judge the result."
          exit 1
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Same cache key as build.yml's own "Cache Playwright browsers" step, so a baseline-authoring
      # run and a real build.yml run on the same package-lock.json share the identical cache entry
      # — never a second, independently-drifting copy of "which Chromium build."
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Resolves to the exact revision playwright-core's pinned version in package-lock.json
      # expects — the SAME resolution build.yml's own gate uses. Never overridden with a
      # locally-convenient PW_CHROME path (see ui-audit/visual-regression.mjs's own header for why
      # that substitution is exactly how the original CI-vs-local mismatch was introduced).
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      # Same build-time env as build.yml's own "Build" step (ci-gates.yml) — B927104 established
      # that a build without these secrets is a DIFFERENT artifact (the header account chip
      # renders "Cloud off" vs "Sign in"), so this has to match exactly, not just be "some" build.
      - name: Build (same Supabase-configured build-time state the required build check uses)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Serve the built app
        run: npx vite preview --port 4173 --strictPort > /tmp/vite-preview.log 2>&1 &
      - name: Wait for the preview server
        run: |
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:4173/ >/dev/null 2>&1; then echo "preview server is up"; exit 0; fi
            sleep 1
          done
          echo "preview server never came up — log:"; cat /tmp/vite-preview.log; exit 1
      # THE AUTHORING STEP. Identical script, identical --approve/--reason contract a person would
      # use locally (see docs/VISUAL-REGRESSION.md's "Approving an intentional change") — the only
      # difference is WHERE it runs. Inputs are passed through env, never interpolated into the
      # shell script directly, so a dispatch input can't break out of a quoted argument (standard
      # GitHub Actions script-injection hygiene; dispatch already requires write access, but the
      # habit costs nothing).
      - name: Render and approve baselines from THIS runner's own output
        env:
          BASE_URL: "http://localhost:4173/"
          REASON_INPUT: ${{ inputs.reason }}
          SURFACE_INPUT: ${{ inputs.surface }}
          VIEWPORT_INPUT: ${{ inputs.viewport }}
        run: |
          set -e
          REASON="${REASON_INPUT} [CI-authored by run ${GITHUB_RUN_ID} on ${GITHUB_SHA}]"
          ARGS=(--approve "--reason=${REASON}")
          if [ -n "${SURFACE_INPUT}" ]; then ARGS+=("--surface=${SURFACE_INPUT}"); fi
          if [ -n "${VIEWPORT_INPUT}" ]; then ARGS+=("--viewport=${VIEWPORT_INPUT}"); fi
          node ui-audit/visual-regression.mjs "${ARGS[@]}"
      # Commits straight back to the SAME branch that was dispatched. This is the one thing that
      # makes the render usable: a human still reviews the resulting commit like any other (the PR
      # diff shows exactly which baseline PNGs changed), but the PIXELS in it were rendered by the
      # only environment that can legitimately judge them.
      - name: Commit CI-authored baselines back to this branch
        id: commit_baselines
        env:
          REASON_INPUT: ${{ inputs.reason }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-audit/visual-baselines/ docs/VISUAL-REGRESSION.md
          if git diff --cached --quiet; then
            echo "No baseline changes to commit — this runner's own render already matches what's committed on this branch."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COMMIT_MSG_FILE="$(mktemp)"
          {
            echo "Authorize CI-rendered visual regression baselines"
            echo ""
            echo "${REASON_INPUT}"
            echo ""
            echo "Rendered and approved by the 'Authorize visual regression baselines' workflow"
            echo "(run ${GITHUB_RUN_ID}, job ${GITHUB_JOB}) against commit ${GITHUB_SHA} — the"
            echo "same ubuntu-latest runner image and pinned Chromium revision the required"
            echo "build check's visual-regression gate judges against, not a locally-captured"
            echo "image. See docs/VISUAL-REGRESSION.md."
            echo ""
            echo "B1171504"
          } > "$COMMIT_MSG_FILE"
          git commit -F "$COMMIT_MSG_FILE"
          rm -f "$COMMIT_MSG_FILE"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed CI-authored baselines to ${GITHUB_REF_NAME}. Note: a push from this workflow's own token may not auto-trigger the required build check (a known, documented quirk of automation-token pushes in this repo — see CLAUDE.md's 'Workflow & deploy' section) — a small nudge commit on the PR branch gets it running if the check stays at 'Expected'."
      # THE TRIAGE ARTIFACT (B1171504). Runs even if the commit/push step above failed or found
      # nothing to commit (`if: always()`), because "the render happened and here is what it found"
      # is worth surfacing regardless of push outcome. Posts to every OPEN PR whose head is this
      # branch — the place a human actually looks before merging — and falls back to the run's own
      # job summary if no PR exists yet, so the report is never silently dropped either way.
      - name: Post baseline triage report (every surface, changed or not, with diff magnitude)
        if: always()
        env:
          PUSHED: ${{ steps.commit_baselines.outputs.pushed }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let triageMd = "_Triage report was not produced — the render/approve step likely failed before writing it; see the job log._";
            try { triageMd = fs.readFileSync(".perf/visual-regression/approve-triage.md", "utf8"); } catch (e) { /* keep default */ }
            const branch = context.ref.replace("refs/heads/", "");
            const pushed = process.env.PUSHED === "true";
            const header = pushed
              ? `**CI-authored baselines were pushed to \`${branch}\`** (run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})).`
              : `**No baseline changes were pushed to \`${branch}\`** — this runner's render already matched what's committed (or the render/commit step failed — check the job log).`;
            const body = `${header}\n\n${triageMd}`;
            const { owner, repo } = context.repo;
            const prs = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, state: "open" });
            if (prs.data.length) {
              for (const pr of prs.data) {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              }
              core.info(`Posted the triage report on PR(s): ${prs.data.map((p) => `#${p.number}`).join(", ")}`);
            } else {
              await core.summary.addRaw(body).write();
              core.info("No open PR found for this branch — wrote the triage report to the job summary instead.");
            }
