name: E2E (Playwright)

# Runs the Playwright e2e suite (B278) against the live/preview deploy and — on ANY failure —
# opens (or bumps) a single @claude GitHub issue with the report, so a broken markup tool is
# fixed before a customer hits it. This is the verifier half of the B421 shared-markup
# refinement loop (B281): the @claude issue is what drives the autonomous
# implement→test→fix→advance cycle for the remaining tool rows.
#
# Idempotent — one open "e2e-drift" issue is reused, not duplicated; auto-closed when green
# again. Same proven pattern as gis-drift.yml.
#
# Gated on the seeded account (B280): without the E2E_EMAIL/E2E_PASSWORD secrets the auth-gated
# specs skip and only the logged-out smoke runs — still a useful signal, never a false alarm.
# BASE_URL defaults to production (planyr.io) when neither the workflow_dispatch input nor the
# E2E_BASE_URL secret is set, so the two account secrets alone are enough to light up full
# signed-in coverage — no separate URL secret required. Runs on a schedule + on demand
# (Actions → Run workflow); a Cloudflare deploy doesn't fire a repo event, so we poll rather
# than trigger on deploy.
on:
  schedule:
    - cron: "30 13 * * 1-5" # 13:30 UTC, weekdays
  workflow_dispatch:
    inputs:
      base_url:
        description: "Origin to test (defaults to the E2E_BASE_URL secret)"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e suite
        id: e2e
        env:
          BASE_URL: ${{ github.event.inputs.base_url || secrets.E2E_BASE_URL || 'https://planyr.io' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          # B266080 — also emit a MACHINE-READABLE result. The list reporter's text is what the
          # @claude issue quoted for 17 red runs, and text is the reason nothing could tell a new
          # regression from the standing 30: it reads identically either way.
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
        run: |
          set +e
          npm run e2e -- --reporter=list,json > e2e-report.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          echo "--- report ---"
          cat e2e-report.txt

      # B266080 — THE DRIFT GATE. The raw suite exit code has been 1 every weekday since
      # 2026-07-22 and will stay 1 until the 30 known-red cases in e2e/known-red.json are fixed
      # (owner: B266081). A signal that is always red carries no information, so the JOB's
      # verdict is now the DIFF against that committed ledger, not the raw exit code:
      #   • a failure that is not on the ledger  → NEW regression → red, named.
      #   • a ledger entry that PASSED           → the ledger is stale → red, so it must shrink.
      # The ledger is in the repo, in a diff, reviewable — not in a comment on a muted thread.
      - name: e2e drift gate (new-vs-known — B266080)
        id: drift
        if: always()
        run: |
          set +e
          node scripts/e2e-drift-gate.mjs --report e2e-results.json --lane ci > e2e-drift.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat e2e-drift.txt
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Open or bump a @claude issue on failure
        if: steps.drift.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner, repo = context.repo.repo;
            // B266080 — lead with the DRIFT verdict (what changed), not the raw tail of a report
            // that has said the same thing every weekday since 2026-07-22. The full list is still
            // attached as the playwright-report artifact.
            let drift = "";
            try { drift = fs.readFileSync("e2e-drift.txt", "utf8"); } catch (_) {}
            if (drift.length > 5000) drift = drift.slice(-5000);
            const body = [
              "@claude — the **e2e drift gate** (B266080) went red against the deploy: either a case",
              "that was NOT on `e2e/known-red.json` failed (a new regression), or a case that IS on it",
              "passed (the ledger is stale and must shrink). Both are actionable; a merely-still-red",
              "known case is not, and no longer files anything.",
              "",
              "Reproduce locally (`npm run e2e`, or `BASE_URL=<url> npm run e2e`), fix it, and re-run.",
              "The tool×property spec in `src/shared/markup/tools.matrix.js` is the source of truth —",
              "do NOT edit it to make a red test pass; the code moves to match the matrix. Likewise do",
              "NOT add a case to the ledger to silence it: that needs `--allow-grow --item B###` and is",
              "an explicit admission that something is broken and is not being fixed.",
              "",
              "```",
              drift.trim() || "(no drift report captured — the gate itself did not run)",
              "```",
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "e2e-drift", per_page: 1,
            });
            if (open.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body: "⏰ Still failing —\n\n" + body });
              core.info(`Bumped existing issue #${open[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner, repo, title: "🎭 Markup e2e regressed — a tool failed its assertions",
                labels: ["e2e-drift"], body,
              });
              core.info(`Opened issue #${created.number}`);
            }
      - name: Close the e2e issue when green
        if: steps.drift.outputs.code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "e2e-drift", per_page: 10,
            });
            for (const iss of open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: iss.number, body: "✅ Markup e2e is green again — closing." });
              await github.rest.issues.update({ owner, repo, issue_number: iss.number, state: "closed" });
              core.info(`Closed issue #${iss.number}`);
            }
      # The suite runs under `set +e` (so the report uploads + the @claude issue opens even on
      # failure), which means the steps above always succeed. Without this gate the JOB would
      # report green on a red suite — exactly the masking that hid a 21-failure run. Fail last,
      # after the issue bookkeeping, so the run status is honest.
      #
      # B266080 — the job now reflects the DRIFT verdict. The raw suite code stays 1 while the 30
      # ledgered cases are outstanding (owner: B266081); making the job red on that forever is
      # what turned this alarm into wallpaper for 17 consecutive runs. It is still printed, and
      # the ledger's size is printed by the gate on every run, so the debt is never invisible —
      # it is just no longer the thing that cries wolf.
      - name: Reflect the e2e drift verdict in the job status
        if: steps.drift.outputs.code != '0'
        run: |
          echo "raw suite exit: ${{ steps.e2e.outputs.code }} · drift gate: ${{ steps.drift.outputs.code }}"
          echo "The drift gate is red — a NEW failure, or a ledger entry that has started passing."
          exit 1

  # ── B266082 — THE LANE THAT HAS NEVER RUN IN CI ───────────────────────────────────────────
  #
  # The job above tests ONE configuration: signed in, against production planyr.io. `npm run
  # e2e` with no BASE_URL tests a completely different one — LOGGED OUT, against a local build
  # of the tree — and nothing in this repository has ever run it. That is not a theoretical
  # gap. B1179 was filed on 2026-07-30 naming three specs red on main; measured on 2026-08-08
  # the production lane above was red on exactly ONE of them (module-keepalive), and the other
  # two had NO WATCHER ANYWHERE. Two of the three had also since been fixed by unrelated work,
  # which nobody could have known either.
  #
  # It runs on the same schedule and on demand, in its own lane of the same ledger, so the two
  # red sets can never be mistaken for each other. It is deliberately NOT part of the required
  # `build` check: a full suite plus a build would put ~15 minutes on every pull request, and
  # a gate people route around is worse than one that runs nightly and is read.
  #
  # Its ledger was seeded from a full sweep in the development sandbox (32 cases). Measured
  # head-to-head against the production lane the same day: 25 of the 30 production failures
  # ALSO fail here, logged out, on a plain local build — so the standing failures are real
  # product/spec breakage, not production or auth noise, and anyone can reproduce them.
  e2e-local:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e suite (logged out, against a local build)
        id: e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
        run: |
          set +e
          npm run e2e -- --reporter=list,json > e2e-local-report.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          echo "--- report ---"
          cat e2e-local-report.txt
      - name: e2e drift gate (local lane — B266080)
        id: drift
        if: always()
        run: |
          set +e
          node scripts/e2e-drift-gate.mjs --report e2e-results.json --lane local > e2e-local-drift.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat e2e-local-drift.txt
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Reflect the local-lane drift verdict in the job status
        if: steps.drift.outputs.code != '0'
        run: |
          echo "raw suite exit: ${{ steps.e2e.outputs.code }} · drift gate: ${{ steps.drift.outputs.code }}"
          exit 1
