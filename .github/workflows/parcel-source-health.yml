name: Parcel source health

# Periodic health sweep over every WIRED parcel source (B1461730/B1461731) — same shape as
# gis-drift.yml's weekly check of the drainage/utility screening registry, for the SEPARATE parcel
# registry (site-planner/lib/counties.js) that verifier doesn't cover. Runs
# ui-audit/parcel-source-health-sweep.mjs and, on ANY source answering with an ArcGIS error body,
# reporting zero features, or being unreachable, opens (or bumps) a single @claude GitHub issue
# with the report — including whatever replacement candidate the neighbour walk found on the same
# server, so a rename like Nevada's (B1455632: republished one service name over, same host, same
# night) is caught the same day it happens rather than by Michael clicking on a map. Idempotent:
# one open "parcel-source-health" issue is reused, not duplicated; auto-closed when green again.
#
# Runs from main only (scheduled workflows always do). Trigger manually any time via the Actions
# tab → Run workflow.
on:
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # No deps needed — the sweep + its lib helpers are plain Node (global fetch) + plain-JS
      # imports from counties.js (no bundler, no React, no Leaflet on that import path).
      - name: Run the parcel source health sweep
        id: sweep
        run: |
          set +e
          node ui-audit/parcel-source-health-sweep.mjs > parcel-health-report.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          echo "--- report ---"
          cat parcel-health-report.txt
      - name: Open or bump a @claude health issue on a broken source
        if: steps.sweep.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner, repo = context.repo.repo;
            let report = "";
            try { report = fs.readFileSync("parcel-health-report.txt", "utf8"); } catch (_) {}
            if (report.length > 5000) report = report.slice(-5000); // keep the issue body sane
            const body = [
              "@claude — the nightly **parcel source health sweep** found a wired parcel source that",
              "has gone missing (an ArcGIS error body, zero features, or unreachable) — the same class",
              "of failure B1455632 fixed for Nevada, whose service was republished one name over on the",
              "same host with the old name left as an empty shell.",
              "",
              "(It also re-queries known lots by id — src/shared/gis/sourceFixturesParcels.js — and a ⛔ line",
              "starting with a county key means that county's owner or acreage DRIFTED: a re-keyed id column,",
              "a swapped owner field or a unit change. Re-measure the lot before editing the fixture.)",
              "",
              "The report below names each broken source and, when the neighbour walk found one, a",
              "same-server replacement candidate by name similarity — confirm it by feature count and",
              "field list before wiring it (`src/workspaces/site-planner/lib/counties.js`), the same",
              "way B1455632 confirmed Nevada's. Re-run: `node ui-audit/parcel-source-health-sweep.mjs`.",
              "",
              "```",
              report.trim() || "(no report captured)",
              "```",
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "parcel-source-health", per_page: 1,
            });
            if (open.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body: "⏰ Still failing —\n\n" + body });
              core.info(`Bumped existing issue #${open[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner, repo, title: "🗺️ Parcel source health — a wired source has gone missing",
                labels: ["parcel-source-health"], body,
              });
              core.info(`Opened issue #${created.number}`);
            }
      - name: Close the health issue when green
        if: steps.sweep.outputs.code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "parcel-source-health", per_page: 10,
            });
            for (const iss of open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: iss.number, body: "✅ Every wired parcel source is answering with real data again — closing." });
              await github.rest.issues.update({ owner, repo, issue_number: iss.number, state: "closed" });
              core.info(`Closed issue #${iss.number}`);
            }
