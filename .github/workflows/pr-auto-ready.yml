name: PR auto-ready

# STOP PRs PARKING AS DRAFTS (B781760, "NEW-1" in the filing brief). The Claude Code web
# session harness that dispatches sessions into this repo defaults every new pull request
# to draft — a harness-level default that lives outside this repo and that nobody here can
# edit. This repo's own policy (see "'Commit' means take it LIVE" above) is the opposite:
# a session that says "commit" is expected to drive the change all the way to merged. The
# two defaults collide, and a text rule in CLAUDE.md cannot reliably win that collision
# against a harness default a session never reads at exactly the right moment — #1157,
# #1162, #1166 and #1180 all sat as green, conflict-free, forever-draft PRs waiting for a
# button nobody was going to press. So the override is mechanical, not another sentence:
# every pull request from a claude/* branch is marked ready for review and armed for
# squash auto-merge automatically, the moment GitHub actually runs this workflow for it
# (see the TOKEN / TRIGGER note below for the one thing that still has to happen first).
#
# THE ONE SANCTIONED WAY TO ASK FOR THE OWNER'S EYES FIRST: apply the "hold" label to the
# PR (or put a `<!-- keep-draft -->` HTML comment anywhere in its body) before this
# workflow's next run. Either one is a standing skip, not a one-time skip — this workflow
# re-checks on every opened/reopened/synchronize event, so a "hold" PR stays parked exactly
# as long as the label stays on it.
#
# THIS WORKFLOW ONLY *ENABLES* AUTO-MERGE. It never merges directly, and it never touches
# branch protection — GitHub still refuses to merge until the required "build" check
# (.github/required-checks.json) reports green on the head commit. A red or pending build
# leaves the PR exactly where auto-merge already leaves every other armed PR: waiting.
#
# TOKEN / TRIGGER NOTE, so the next session doesn't have to re-derive this. GITHUB_TOKEN is
# enough to make GitHub actually RUN this workflow — markPullRequestReadyForReview and
# enablePullRequestAutoMerge are PR-metadata mutations, not git pushes, so they don't need to
# (and don't) retrigger the "build" check themselves; build.yml already runs on the same
# pull_request event (opened/synchronize/reopened) this workflow reacts to, draft or not
# (build.yml carries no draft filter). What this workflow does NOT fix is the pre-existing,
# already-documented gap right above this file in CLAUDE.md: a PR *opened* via the Claude Code
# automation's own app token often never fires that first pull_request "opened" trigger at all,
# for either workflow. The routine nudge commit a shipping session already pushes (a real git
# push, firing "synchronize") is what makes both this workflow AND the "build" check report —
# this workflow rides the exact same fix, it does not need a second one.
# ⛔ BUT GITHUB_TOKEN IS **NOT** ENOUGH TO PERFORM THE TWO MUTATIONS THEMSELVES (corrected
# 2026-08-31, B793696/B914449 — this note used to say "GITHUB_TOKEN is enough" as one claim
# covering both triggering AND mutating; that conflated two different things and the mutation
# half was wrong). markPullRequestReadyForReview and enablePullRequestAutoMerge both come back
# FORBIDDEN ("Resource not accessible by integration") under GITHUB_TOKEN in this repo, proven
# on real PRs three separate times under three different credential/setting combinations — see
# the ⛔ PERMISSIONS block below. This is now a permanent, owner-accepted limitation, not an
# open question: do not spend another session re-diagnosing it, and do not switch to a
# repository PAT without a fresh, explicit owner go-ahead (he was asked and declined one on
# 2026-08-31, because the manual step this job's FORBIDDEN branch describes costs him nothing).
#
# ⛔ PERMISSIONS (B793696, fixing B781760's first shipped version; RECLASSIFIED as a known,
# accepted, permanent limitation 2026-08-31 — see B793696 in BACKLOG.md for the full record).
# The workflow/job-level `permissions:` blocks below CANNOT fix a FORBIDDEN response on their
# own — they were already present when this failed live on PR #1188 (`enablePullRequestAuto
# Merge`) and #1190 (`markPullRequestReadyForReview`, confirmed FORBIDDEN too), with
# GITHUB_TOKEN Permissions already printing the requested scope as granted. TWO repository
# settings were then tried and BOTH ruled out empirically: "Workflow permissions: Read and
# write" (flipped 2026-08-31, re-tested on PR #1246 — still FORBIDDEN) and "Allow GitHub
# Actions to create and approve pull requests" (flipped 2026-08-31, re-tested on PR #1255 —
# still FORBIDDEN). A THIRD path — the installed "Claude" GitHub App acting on this workflow's
# behalf — is not fixable at all: a workflow can only act as a GitHub App if it holds that
# App's private key, and only the App's creator (Anthropic, not this repo) holds it. The
# remaining fix (a fine-grained PAT or a small self-owned GitHub App) is a credential the owner
# has to explicitly authorize; he reviewed this 2026-08-31 and declined, because a session
# marking its own PR ready by hand costs him nothing. These job-level `permissions:` blocks
# stay for clarity but were never the fix and are not expected to become one.
#
# ⛔ B914449 (2026-08-31): given the above is permanent, `auto-ready` below no longer fails the
# job (`core.setFailed`) on the diagnosed FORBIDDEN case for EITHER mutation — it reports the
# expected condition with `core.notice` and lets the run pass, so a known, accepted limitation
# stops painting every claude/* PR's checks red. Any OTHER error (a different message, a
# different failure mode) still fails the job loudly — this is a narrow, diagnosed exception,
# not a blanket swallow. And if either mutation ever SUCCEEDS, the job says so just as loudly
# (also `core.notice`): that would mean a credential now exists and B793696 should be reopened
# and closed as actually fixed, so that recovery must never go unannounced.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  # Idempotent and self-healing: runs on every trigger (cheap, no-op once the label exists),
  # so the label can never go missing for long even if someone deletes it by hand. Also the
  # one piece of this workflow worth invoking directly via workflow_dispatch, to create the
  # label immediately rather than waiting on the next claude/* PR.
  ensure-hold-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Ensure the "hold" label exists
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: "hold",
                color: "d93f0b",
                description: "Leave this PR as a draft — the owner should look at it before it merges.",
              });
              core.info('Created the "hold" label.');
            } catch (err) {
              if (err.status === 422) {
                core.info('"hold" label already exists — nothing to do.');
              } else {
                throw err;
              }
            }

  auto-ready:
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Mark ready for review + arm squash auto-merge (unless held)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const held = (pr.labels || []).some((l) => (l.name || "").toLowerCase() === "hold");
            const keepDraft = /<!--\s*keep-draft\s*-->/i.test(pr.body || "");
            if (held || keepDraft) {
              core.info(
                `Leaving #${pr.number} as-is — ${held ? '"hold" label present' : "keep-draft marker in body"}.`
              );
              return;
            }
            // B793696, RECLASSIFIED 2026-08-31 (B914449) as a known, owner-accepted, PERMANENT
            // limitation — not an open question, not something to re-diagnose. GITHUB_TOKEN
            // cannot perform either mutation below in this repo: confirmed FORBIDDEN on real
            // PRs three times, under three different credential/setting combinations (see the
            // header comment block above for the full list). The owner reviewed this 2026-08-31
            // and declined the two things that would actually fix it (a PAT, a self-owned
            // GitHub App), because a session marking its own PR ready by hand costs him nothing.
            // So: still ATTEMPT both mutations every run, in case the limitation ever lifts —
            // but the diagnosed FORBIDDEN case is reported with core.notice and the run PASSES,
            // not core.setFailed. Any OTHER error is still unknown and still fails the job loudly
            // (the `throw err` branches below) — this is a narrow, diagnosed exception, not a
            // blanket swallow. And a mutation that SUCCEEDS is reported just as loudly as one
            // that fails FORBIDDEN — see reportRecovered — because a silent recovery is how an
            // accepted limitation rots into a forgotten one.
            const isForbidden = (err) =>
              /resource not accessible by integration/i.test(err && err.message || "");
            const reportForbidden = (mutation) => {
              core.notice(
                `${mutation} FORBIDDEN on #${pr.number} — known limitation B793696 ` +
                  `(owner-accepted 2026-08-31; no credential currently available to GITHUB_TOKEN ` +
                  `can perform this mutation in this repo). This is expected, not a workflow bug. ` +
                  `The session that opened #${pr.number} marks it ready / arms auto-merge itself, ` +
                  `directly via the GitHub MCP tools, as a normal part of shipping — see CLAUDE.md.`
              );
            };
            const reportRecovered = (mutation) => {
              core.notice(
                `${mutation} SUCCEEDED on #${pr.number}. B793696 was accepted as a PERMANENT ` +
                  `limitation on 2026-08-31 — if this keeps succeeding, a credential now exists. ` +
                  `Reopen B793696 in BACKLOG.md and close it as actually fixed.`
              );
            };
            if (pr.draft) {
              try {
                await github.graphql(
                  `mutation($id: ID!) {
                    markPullRequestReadyForReview(input: { pullRequestId: $id }) {
                      pullRequest { id isDraft }
                    }
                  }`,
                  { id: pr.node_id }
                );
                reportRecovered("markPullRequestReadyForReview");
              } catch (err) {
                if (isForbidden(err)) {
                  reportForbidden("markPullRequestReadyForReview");
                  return;
                }
                throw err;
              }
            }
            if (pr.auto_merge) {
              core.info(`#${pr.number} already has auto-merge armed — nothing to do.`);
              return;
            }
            try {
              await github.graphql(
                `mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                    pullRequest { id autoMergeRequest { enabledAt } }
                  }
                }`,
                { id: pr.node_id }
              );
              reportRecovered("enablePullRequestAutoMerge");
            } catch (err) {
              if (/already enabled/i.test(err.message || "")) {
                core.info(`#${pr.number} already has auto-merge armed — nothing to do.`);
              } else if (isForbidden(err)) {
                reportForbidden("enablePullRequestAutoMerge");
              } else {
                throw err;
              }
            }
