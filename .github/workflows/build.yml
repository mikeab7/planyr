name: Build

# Builds the Vite app as the "it builds" status check (lint + test + build) on every
# pull request into main and on pushes to main. This is the check that gates merges
# into main (see the branch-protection rule) — it does NOT publish anything.
#
# Production is served by Cloudflare Pages via its own GitHub App connection (there is
# no Cloudflare workflow file in this repo). The old GitHub Pages deploy job was
# retired once Cloudflare became production — one host, one deploy.
#
# ⛔ PARALLEL LANES (2026-11-23, Batch C of the code audit). `build` used to be ONE serial job of 41 gates, ~42 minutes (18 of
# them Notes browser harnesses, 25 min), and main's pushes queued behind each other. It is now an AGGREGATOR over parallel lane
# jobs — static · vitest (3 shards) · build-app · browser (4 shards) — each of which runs `npm run ci-parity -- --lane <name>`.
# The job named exactly `build` below only checks that every lane succeeded, so the required status-check context
# (.github/required-checks.json, the "Protect Main" ruleset) is unchanged and still reports on every pull request, docs-only
# ones included. Which gate runs in which lane is ui-audit/lib/ciGates.mjs LANES; the gate LIST is still only ci-gates.yml.
#
# ⛔ THE GATES THEMSELVES LIVE IN .github/ci-gates.yml, NOT HERE (2026-09-02, owner-approved after
# the third CI-vs-local mismatch in a week — B927104 / the 2026-08-31 bundle night / PR #1323).
# `npm run ci-parity` (scripts/ci-parity.mjs) reads that sibling file's ordered step list at run
# time (ui-audit/lib/workflowContract.mjs's jobSteps() — the same parser used on THIS file, below)
# and runs exactly what it says, so there is exactly ONE list of "what the required build check
# runs" — never a copy here and a copy there that can silently drift apart. A developer runs
# `npm run ci-parity` on their own machine and gets the SAME verdict this job does, gate by gate,
# including the same handling of a missing Supabase secret (see that script's own header). This
# file keeps only what genuinely can't move into the script: real GitHub Actions (a runner-only
# cache, an artifact upload) and the toolchain setup those gates assume has already happened — see
# scripts/ci-parity.mjs's own header for the full "not covered, and why" list.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # `pr_number` is set ONLY by build-check-sweep.yml's repair dispatch (NEW-3, 2026-09-05) — see
  # that workflow's header for the outage this closes. A plain manual "Run workflow" click leaves
  # it blank, which is exactly what skips the backfill-status step below (its `if:` reads that
  # same input), so an ordinary manual dispatch behaves exactly as it always has.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to backfill the required 'build' status for (set by build-check-sweep.yml; leave blank for an ordinary manual run)"
        required: false

# Cancel a SUPERSEDED run so an iterating pull request only ever finishes paying for its NEWEST push (keyed on the ref).
# MAIN IS KEYED PER COMMIT instead (2026-11-23): a push to main used to share one group with every other push to main with
# cancel-in-progress off, which made them QUEUE (one waited 18 minutes) — and GitHub also replaces a *waiting* run with the
# newest one, so a middle commit could silently lose its verdict. One group per sha means every merged commit runs
# immediately, in parallel, and gets its own verdict; nothing is ever cancelled on main.
concurrency:
  group: build-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # Lets the aggregator's backfill step post a classic commit status directly — needed only when `inputs.pr_number` is set
  # (build-check-sweep.yml's repair dispatch); inert otherwise. `statuses: write` is a plain, same-repo, non-elevated grant on
  # the default GITHUB_TOKEN (unlike markPullRequestReadyForReview / enablePullRequestAutoMerge, FORBIDDEN for it — B793696).
  statuses: write

jobs:
  # ---- detect: is this pull request Markdown-only? -------------------------------------------------------------------------
  # Cost cut (2026-09-02): a Markdown-only PR has no code to lint, test or build, so only the cheap docs guards run (see
  # ui-audit/lib/ciGates.mjs DOCS_ONLY_GATE_NAMES). THIS DELIBERATELY DOES NOT SKIP THE REQUIRED CHECK — no `paths-ignore`
  # on the triggers: a required check a path filter can skip is exactly the 2026-08-06 outage ui-audit/required-check-audit.mjs
  # guards. Every job below always reports; only whether the heavy lanes do real work varies. The merge ref's first parent is
  # the base branch tip, so `HEAD^1..HEAD` is exactly what the pull request changes (a depth-2 fetch, not the 190 MB history).
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.docs_only.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Detect docs-only change (a pull_request whose diff is Markdown only)
        id: docs_only
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Not a pull_request event (push to main / workflow_dispatch) — every merged commit gets its own full verdict, unconditionally."
            exit 0
          fi
          set +e
          CHANGED="$(git diff --name-only HEAD^1 HEAD 2>/dev/null)"
          DIFF_STATUS=$?
          set -e
          if [ $DIFF_STATUS -ne 0 ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Could not compute the PR diff (git exit $DIFF_STATUS) — falling back to the full build, never to the fast path."
            exit 0
          fi
          echo "Changed files:"
          echo "$CHANGED"
          NON_DOCS="$(echo "$CHANGED" | grep -Ev '\.md$' || true)"
          if [ -n "$CHANGED" ] && [ -z "$NON_DOCS" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Every changed file is Markdown (.md) — running the docs-only gate subset."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "A non-Markdown file changed, or nothing changed — running the full build."
          fi

  # ---- static: lint + the cheap guards (also the whole docs-only run) ------------------------------------------------------
  static:
    name: static
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the Generated-index touch guard diffs `origin/main...HEAD`, which needs a merge base. This is the
          # ONLY lane that pays for it; every other lane is a shallow, depth-1 checkout.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Run CI gates (scripts/ci-parity.mjs — the single source of truth for what this build checks)
        run: npm run ci-parity -- --lane static
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CI_DOCS_ONLY: ${{ needs.detect.outputs.docs_only }}

  # ---- vitest: `npm test`, split three ways ---------------------------------------------------------------------------------
  vitest:
    name: vitest (${{ matrix.shard }}/3)
    needs: detect
    if: needs.detect.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Run CI gates (scripts/ci-parity.mjs — the single source of truth for what this build checks)
        run: npm run ci-parity -- --lane vitest --shard ${{ matrix.shard }}/3
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  # ---- build-app: the Vite build + the bundle budget; hands dist/ to the browser lanes -------------------------------------
  build-app:
    name: build-app
    needs: detect
    if: needs.detect.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # The base ref's bundle numbers (for the budget gate's "which modules moved" attribution) used to come from BUILDING the
      # base ref a second time (~45 s) off a full-history checkout. Main's own build now saves its stats under its commit's sha
      # (the last step of this job), so a pull request — or the next push to main — just restores them. A miss falls back to the
      # old behaviour, never fatal: scripts/perf-base-stats.mjs fetches that one commit (depth 1) and builds it.
      - name: Restore the base commit's bundle stats
        id: base_stats
        uses: actions/cache/restore@v4
        with:
          path: .perf/cached-stats.json
          key: perf-stats-${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Run CI gates (scripts/ci-parity.mjs — the single source of truth for what this build checks)
        run: npm run ci-parity -- --lane build-app
        env:
          # The SAME truthy-or-not value on every gate that builds (B927104: two different truthy-nesses on the two sides of
          # a byte comparison is a permanent phantom delta) — one place, one step.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PERF_BASE_STATS_HIT: ${{ steps.base_stats.outputs.cache-hit }}
          PERF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Upload the built app for the browser lanes
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Save this commit's bundle stats for the next base comparison (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .perf/cached-stats.json
          key: perf-stats-${{ github.sha }}

  # ---- browser: every gate that drives Chromium against the built app, split across four machines -------------------------
  browser:
    name: browser (${{ matrix.shard }}/4)
    needs: [detect, build-app]
    if: needs.detect.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # The exact bytes build-app measured — the browser gates test what the bundle budget saw, with no second build.
      - name: Download the built app
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Needs the exact Chromium revision `npx playwright install --with-deps chromium` resolves to; restoring this BEFORE the
      # gates run makes that install a ~10 s cache hit instead of a ~290 MB download (only the apt package install still runs).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Run CI gates (scripts/ci-parity.mjs — the single source of truth for what this build checks)
        run: npm run ci-parity -- --lane browser --shard ${{ matrix.shard }}/4
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Visual regression diffs (NEW-1): the gate writes its failure diffs to .perf/visual-regression/ (gitignored) — a
      # downloadable copy is the one thing about a failure a local run doesn't need and CI does.
      - name: Upload visual regression diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs-${{ matrix.shard }}
          path: .perf/visual-regression/
          if-no-files-found: ignore
          retention-days: 14

  # ---- build: THE required check. Passes only if every lane passed. -------------------------------------------------------
  # The job id AND check name stay exactly `build` (.github/required-checks.json; ui-audit/required-check-audit.mjs proves it is
  # produced on pull_request → main and still reports on a docs-only change). `if: always()` so a failed or cancelled lane
  # turns THIS check red instead of leaving it "skipped"/"Expected"; a lane may be skipped only on a docs-only run, where the
  # heavy lanes are skipped on purpose and `static` ran the docs-only subset.
  build:
    name: build
    needs: [detect, static, vitest, build-app, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every lane must have passed
        id: verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.detect.outputs.docs_only }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const docsOnly = process.env.DOCS_ONLY === "true";
            const must = ["detect", "static"];
            const heavy = ["vitest", "build-app", "browser"];
            const bad = [];
            for (const [name, n] of Object.entries(needs)) {
              const ok = n.result === "success" || (docsOnly && heavy.includes(name) && n.result === "skipped");
              console.log((ok ? "ok   " : "FAIL ") + name + ": " + n.result);
              if (!ok) bad.push(name + " (" + n.result + ")");
            }
            for (const name of [...must, ...heavy]) if (!(name in needs)) bad.push(name + " (missing from needs)");
            if (bad.length) { console.error("\nbuild FAILS — lane(s) not green: " + bad.join(", ")); process.exit(1); }
            console.log("\nbuild passes — every lane green" + (docsOnly ? " (docs-only run: the heavy lanes were skipped on purpose)" : "") + ".");
          '
      # Backfill the required "build" status (NEW-3, 2026-09-05). Inert on every ordinary run — only fires when
      # build-check-sweep.yml dispatched THIS run to repair a PR whose required "build" check never reported at all. A
      # `workflow_dispatch` run's own check does NOT satisfy a PR's required status, so this posts a CLASSIC commit status
      # directly via the Statuses API, which required-status matching honors regardless of the event. `always()` so a
      # failing build still reports "failure" rather than leaving the PR stuck a second way.
      - name: Backfill required status for a sweep-repaired PR
        if: always() && github.event.inputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const prNumber = Number('${{ github.event.inputs.pr_number }}');
            const outcome = '${{ steps.verdict.outcome }}'; // success | failure | cancelled | skipped
            const state = outcome === 'success' ? 'success' : 'failure';
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const sha = pr.head.sha;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha, state, context: "build", target_url: runUrl,
              description: state === "success"
                ? "CI gates passed (backfilled by build-check-sweep.yml — the native run never reported)"
                : "CI gates failed (backfilled by build-check-sweep.yml — the native run never reported)",
            });
            core.info(`Posted classic status "${state}" for build on ${owner}/${repo}@${sha} (PR #${prNumber}).`);
