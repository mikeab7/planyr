name: Build

# Builds the Vite app as the "it builds" status check (lint + test + build) on every
# pull request into main and on pushes to main. This is the check that gates merges
# into main (see the branch-protection rule) — it does NOT publish anything.
#
# Production is served by Cloudflare Pages via its own GitHub App connection (there is
# no Cloudflare workflow file in this repo). The old GitHub Pages deploy job was
# retired once Cloudflare became production — one host, one deploy.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, for two independent reasons that both need it:
          #  • the mint gate computes this branch's merge base with main — the shallow default
          #    hides it, and "added ids" measured against main's tip is strictly weaker (it
          #    cannot see a number main took while this branch was in flight);
          #  • the byte-attribution step below resolves that same base and BUILDS it, so a
          #    breach can name which modules moved. With depth 1 there is no base to compare
          #    against and that step degrades to "unavailable" — honestly reported, but the
          #    diagnosis is the point, so pay for the history.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (fails the build on a dangling/undefined identifier)
        run: npm run lint
      - name: GIS source registry guard (no test/non-authoritative endpoint, no inline URLs — B369)
        run: node ui-audit/gis-source-audit.mjs
      - name: MAP.md drift guard (regenerate with `node scripts/build-map.mjs` — B637)
        run: node scripts/build-map.mjs --check
      - name: BACKLOG_OPEN.md drift + tag-legend guard (regenerate with `node scripts/build-backlog-index.mjs` — B638)
        run: node scripts/build-backlog-index.mjs --check
      - name: e2e fixture drift guard (regenerate with `node scripts/build-fixtures.mjs` — B278/B280 harness)
        run: node scripts/build-fixtures.mjs --check
      - name: Landing coverage drift guard (regenerate with `node scripts/build-landing-coverage.mjs` — B1385)
        run: node scripts/build-landing-coverage.mjs --check
      # Mint gate (B779 second pass). The uniqueness tests below catch a collision once both items
      # are in the same tree; this catches one whose twin is still on an UNMERGED branch, which no
      # static check of this repo can see. A proven collision fails the build (renumbering is a
      # few heading lines); an infrastructure problem warns loudly rather than wedging merges —
      # `--ci` draws exactly that line, and the pre-push hook is the strict first line of defence.
      - name: Mint gate (new B#/V# unclaimed on main and on in-flight branches — B779)
        run: node scripts/check-mint.mjs --ci
      - name: Test (pure-logic smoke tests)
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Supabase connection (Phase 1). Set these as repository secrets:
          # Settings → Secrets and variables → Actions. Safe to be absent — the app
          # runs fine un-configured (the cloud chip just shows "Cloud off").
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Performance budget gate (NEW-8). Deterministic half only — bundle weight and the
      # Site-route chunk allowlist, computed from dist/.vite/manifest.json with no browser.
      # A breach names the metric and its delta. The runtime half (frame time, heap, tiles)
      # is deliberately NOT gated here: it is too sensitive to shared-runner CPU contention
      # to gate a merge on. See docs/PERF-BUDGETS.md.
      # NEW-3 — build the base ref and snapshot its bundle, so the budget step below can name
      # WHICH modules and packages moved rather than only that a number did. Diagnosis, not a
      # gate: this script never exits non-zero, and it prints why when it cannot run.
      - name: Base-ref bundle snapshot (byte attribution — NEW-3, never fatal)
        run: node scripts/perf-base-stats.mjs --out .perf/base-stats.json
      - name: Performance budget (bundle weight + Site-route chunk allowlist — NEW-8)
        run: node ui-audit/perf-bundle-audit.mjs --compare .perf/base-stats.json --emit-stats .perf/head-stats.json
