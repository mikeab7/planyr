name: Build

# Builds the Vite app as the "it builds" status check (lint + test + build) on every
# pull request into main and on pushes to main. This is the check that gates merges
# into main (see the branch-protection rule) — it does NOT publish anything.
#
# Production is served by Cloudflare Pages via its own GitHub App connection (there is
# no Cloudflare workflow file in this repo). The old GitHub Pages deploy job was
# retired once Cloudflare became production — one host, one deploy.
#
# ⛔ THE GATES THEMSELVES LIVE IN .github/ci-gates.yml, NOT HERE (2026-09-02, owner-approved after
# the third CI-vs-local mismatch in a week — B927104 / the 2026-08-31 bundle night / PR #1323).
# `npm run ci-parity` (scripts/ci-parity.mjs) reads that sibling file's ordered step list at run
# time (ui-audit/lib/workflowContract.mjs's jobSteps() — the same parser used on THIS file, below)
# and runs exactly what it says, so there is exactly ONE list of "what the required build check
# runs" — never a copy here and a copy there that can silently drift apart. A developer runs
# `npm run ci-parity` on their own machine and gets the SAME verdict this job does, gate by gate,
# including the same handling of a missing Supabase secret (see that script's own header). This
# file keeps only what genuinely can't move into the script: real GitHub Actions (a runner-only
# cache, an artifact upload) and the toolchain setup those gates assume has already happened — see
# scripts/ci-parity.mjs's own header for the full "not covered, and why" list.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, for two independent reasons that both need it:
          #  • the mint gate computes this branch's merge base with main — the shallow default
          #    hides it, and "added ids" measured against main's tip is strictly weaker (it
          #    cannot see a number main took while this branch was in flight);
          #  • the byte-attribution step below resolves that same base and BUILDS it, so a
          #    breach can name which modules moved. With depth 1 there is no base to compare
          #    against and that step degrades to "unavailable" — honestly reported, but the
          #    diagnosis is the point, so pay for the history.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Visual regression baselines (further down the gate list, inside npm run ci-parity) need the exact
      # Chromium revision `npx playwright install --with-deps chromium` resolves to. Restoring this
      # cache BEFORE the gates run is what makes that install a ~10s cache hit instead of a ~290 MB
      # download on every push; only the (much cheaper) OS package install still runs every time,
      # since GitHub-hosted runners don't persist apt state.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Run CI gates (scripts/ci-parity.mjs — the single source of truth for what this build checks)
        run: npm run ci-parity
        env:
          # Supabase connection (Phase 1). Set these as repository secrets:
          # Settings → Secrets and variables → Actions. Safe to be absent — the app runs fine
          # un-configured (the cloud chip just shows "Cloud off") — but ci-parity.mjs's own build
          # and its base-ref/visual-regression comparisons need the SAME truthy-or-not value on
          # every gate that touches it, which is why there is exactly one place these are set now
          # (B927104: two different truthy-nesses on the two sides of a byte comparison is a
          # permanent phantom delta) — see scripts/ci-parity.mjs / ui-audit/lib/ciGates.mjs.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Visual regression diffs (NEW-1). ci-parity.mjs's own visual-regression.mjs gate writes its
      # failure diffs to .perf/visual-regression/ (gitignored) — this is the one thing about a
      # failure a local run doesn't need (the files are already on disk) that CI does: a
      # downloadable copy for whoever is looking at the failed run in the GitHub UI.
      - name: Upload visual regression diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: .perf/visual-regression/
          if-no-files-found: ignore
          retention-days: 14
