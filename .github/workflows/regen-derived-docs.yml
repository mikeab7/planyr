name: Regenerate derived docs

# Nightly regeneration of the three GENERATED, committed indexes (NEW-1, B<PENDING>, 2026-09-08):
# MAP.md (scripts/build-map.mjs), BACKLOG_OPEN.md (scripts/build-backlog-index.mjs), and
# docs/UI-INVENTORY.md (ui-audit/ui-inventory.mjs). A branch never regenerates these itself any
# more — scripts/generated-doc-touch-guard.mjs fails a PR that touches any of them — because every
# PR that DID used to conflict with every other PR open at the same time that also touched the
# same generated file, and GitHub can't even compute a test-merge for a conflicted PR, so the
# required `build` check never ran at all ("Expected — waiting for status to be reported" forever;
# see that guard's own header for the measured PR #1529 incident). This workflow is the
# replacement: it refreshes the files on a schedule instead of on every PR.
#
# WHY A PR AND NOT A DIRECT COMMIT TO MAIN. `main` requires a passing `build` check via a pull
# request, and every OTHER mutating GitHub API call this repo has tried against a protected/PR
# surface with the default GITHUB_TOKEN has come back FORBIDDEN — `markPullRequestReadyForReview`
# and `enablePullRequestAutoMerge` both, confirmed under every credential/setting combination
# there was to try (CLAUDE.md's "Workflow & deploy" section, B793696). This session had no safe,
# non-destructive way to test whether a plain `git push` to `main` would ALSO be refused by branch
# protection without either attempting the push for real (a live test against a protected branch
# this repo's own rules say never to push to directly) or reading repo settings this session's
# tools can't reach — so, per that same section's own instruction ("do not change repo settings
# yourself; if [bypassing protection] needs a settings change, take the PR-based option and say
# what the owner would have to click"), this workflow opens a small PR rather than pushing to main
# directly. If a direct push is ever wanted instead: repo Settings → Branches → the `main`
# protection rule → "Allow specified actors to bypass required pull requests" (Team/Enterprise
# only) → add the `github-actions` app — until that's granted, or until this is tested and found
# to work some other way, this workflow's PR-based path is what runs.
#
# This PR cannot arm itself either — `enablePullRequestAutoMerge` is the same FORBIDDEN call — so
# a human or a Claude Code session merges it once its required `build` check (the cheap docs-only
# subset — see ui-audit/lib/ciGates.mjs's DOCS_ONLY_GATE_NAMES) is green. If that check never
# reports at all, build-check-sweep.yml's existing 10-minute sweep repairs it automatically like
# any other stuck PR. These files can be briefly stale between refreshes — that's fine: they are a
# project-knowledge index and a light drift/tag check, never a runtime source of truth, and
# nothing in the app reads them.
#
# Runs from main only (scheduled workflows always do); trigger manually any time via the Actions
# tab → Run workflow.

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate MAP.md and BACKLOG_OPEN.md (cheap — no browser needed)
        run: |
          node scripts/build-map.mjs
          node scripts/build-backlog-index.mjs
          node scripts/ledger.mjs render   # BACKLOG.md + VERIFICATION.md views of ledger/ (NEW-1, ledger)

      # docs/UI-INVENTORY.md needs a real build + a live Playwright crawl of it — the same steps
      # build.yml's own Signature-budget gate uses, reused here rather than duplicated by hand.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Build the app (for the UI-inventory crawl)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Serve the built app
        run: npx vite preview --port 4173 --strictPort > /tmp/vite-preview.log 2>&1 &
      - name: Wait for the preview server
        run: |
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:4173/ >/dev/null 2>&1; then echo "preview server is up"; exit 0; fi
            sleep 1
          done
          echo "preview server never came up — log:"; cat /tmp/vite-preview.log; exit 1
      - name: Regenerate docs/UI-INVENTORY.md
        run: node ui-audit/ui-inventory.mjs
        env:
          BASE_URL: "http://localhost:4173/"

      - name: Check whether anything actually changed
        id: diff
        run: |
          if git diff --quiet -- MAP.md BACKLOG_OPEN.md BACKLOG.md VERIFICATION.md docs/UI-INVENTORY.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All three files are already up to date — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- MAP.md BACKLOG_OPEN.md BACKLOG.md VERIFICATION.md docs/UI-INVENTORY.md
          fi

      # Idempotent, same shape as gis-drift.yml/parcel-snapshot.yml's "bump, don't duplicate"
      # pattern (adapted for a PR instead of an issue): never open a second regen PR while one is
      # already open and unmerged.
      - name: Check for an already-open regen PR
        if: steps.diff.outputs.changed == 'true'
        id: existing
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", base: "main", per_page: 100,
            });
            const open = prs.find((p) => p.head.ref.startsWith("chore/regen-derived-docs"));
            core.setOutput("open", open ? String(open.number) : "");
            if (open) core.info(`A regen PR is already open: #${open.number} (${open.head.ref}) — skipping.`);

      - name: Commit and push the regenerated files to a new branch
        if: steps.diff.outputs.changed == 'true' && steps.existing.outputs.open == ''
        id: push
        run: |
          BRANCH="chore/regen-derived-docs-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add MAP.md BACKLOG_OPEN.md BACKLOG.md VERIFICATION.md docs/UI-INVENTORY.md
          git commit -m "Regenerate derived docs (MAP.md / BACKLOG_OPEN.md / BACKLOG.md / VERIFICATION.md / docs/UI-INVENTORY.md)"
          git push -u origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open the regeneration PR
        if: steps.diff.outputs.changed == 'true' && steps.existing.outputs.open == ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "Automated refresh of the three generated, committed indexes — no manual edits.",
              "",
              "Branches no longer regenerate these themselves (NEW-1, B<PENDING>, 2026-09-08): every PR",
              "that touched one used to force every OTHER concurrently-open PR touching the same file",
              "into a conflict, and GitHub cannot even compute a test-merge ref for a conflicted PR — so",
              "the required `build` check never ran at all (\"Expected — waiting for status to be",
              "reported\" forever). This workflow is the replacement: it refreshes the files on a",
              "schedule instead of on every PR. See scripts/generated-doc-touch-guard.mjs for the guard",
              "that now rejects a branch touching these files, and that script's own header for the",
              "measured incident (PR #1529) this fixes.",
              "",
              "**These files can be briefly stale between refreshes — that's expected and fine.** They",
              "are a project-knowledge index and a light drift/tag check, never a runtime source of",
              "truth, and nothing in the app reads them.",
              "",
              "**This PR needs a human (or a Claude Code session) to merge it.** The default",
              "GITHUB_TOKEN a scheduled workflow runs with has already been confirmed FORBIDDEN for",
              "`enablePullRequestAutoMerge` in this repo (B793696), so it cannot arm auto-merge on",
              "itself. Its required `build` check is real but cheap (the docs-only gate subset); if it",
              "never reports at all, `build-check-sweep.yml`'s existing 10-minute sweep repairs it",
              "automatically like any other stuck PR.",
            ].join("\n");
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Regenerate derived docs (MAP.md / BACKLOG_OPEN.md / BACKLOG.md / VERIFICATION.md / docs/UI-INVENTORY.md)",
              head: "${{ steps.push.outputs.branch }}",
              base: "main",
              body,
            });
