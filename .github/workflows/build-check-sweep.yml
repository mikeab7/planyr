name: Required build-check sweep

# Detector + repair for a required "build" status check that never reports at all (NEW-3,
# 2026-09-05). Measured live today on PRs #1455 and #1456: both sat at "Expected — Waiting for
# status to be reported" — a state that looks alive and is dead, because GitHub withholds ALL
# merge control while a required context is unreported, even from an administrator — while
# `actions_list`/`get_check_runs` showed ZERO workflow runs behind either PR, at any point, for
# any commit. This is NOT the docs-only fast path or a `paths:` filter hiding the job:
# `ui-audit/required-check-audit.mjs` already proves build.yml's `on:` block carries no path
# filter at all (the job always runs; only which STEPS inside it do real work varies), and that
# gate is green right now. It's a `pull_request` webhook that, for whatever reason, never fired
# for those branches' pushes — a gap in GitHub's own event delivery, not in this repo's config,
# so no workflow-file change alone can prevent it happening again.
#
# So this is a SAFETY NET rather than a root-cause fix, in the spirit of CLAUDE.md's own
# "if drafts start silently parking again, the fix is a DETECTOR, not another actuator" —
# adapted here because, unlike that case, there is genuinely nothing to detect-and-report-on:
# the required check has to actually get a value or the PR is stuck forever. Every 10 minutes:
#   1. list open PRs into main;
#   2. for each, ask GitHub directly (combined commit status + check-runs, both APIs — a required
#      context can be satisfied by either) whether the current head commit has ANY "build" entry
#      at all — pending, in-progress, success, or failure all count as "reported; leave it alone".
#      Only a commit with NOTHING under that name is "stuck".
#   3. give a stuck commit a grace period (6 minutes since the PR's own last update) so an
#      ordinary in-flight run — CLAUDE.md's own measured 3–44s normal case — is never raced;
#   4. if still nothing after that, and no repair dispatch is already queued/running for that
#      branch, re-dispatch build.yml against the PR's head ref with `pr_number` set. build.yml's
#      own tail step then posts a classic commit status for that exact PR's head SHA once the
#      gates finish — see that workflow for why a plain workflow_dispatch check run doesn't count
#      on its own (a `workflow_dispatch` run's auto-generated check does NOT satisfy a PR's
#      required status — CLAUDE.md's "Nudge CI" section — only a classic Statuses-API post, or a
#      real `pull_request`/`push` event, does).
#
# Idempotent by construction: once ANY entry exists for "build" on a commit (including one this
# workflow itself posted), the next sweep sees it and does nothing further for that commit.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Find and repair PRs whose required "build" check never reported
        id: sweep
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const GRACE_MS = 6 * 60 * 1000;
            const now = Date.now();
            const repaired = [];
            const errors = [];

            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: "open", base: "main", per_page: 100 });
            core.info(`Open PRs into main: ${prs.length}`);

            for (const pr of prs) {
              try {
                const sha = pr.head.sha;
                const [{ data: combined }, { data: checkRuns }] = await Promise.all([
                  github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha }),
                  github.rest.checks.listForRef({ owner, repo, ref: sha }),
                ]);
                const hasBuildSignal =
                  combined.statuses.some((s) => s.context === "build") ||
                  checkRuns.check_runs.some((c) => c.name === "build");
                if (hasBuildSignal) continue;

                const ageMs = now - new Date(pr.updated_at).getTime();
                if (ageMs < GRACE_MS) {
                  core.info(`#${pr.number} (${sha.slice(0, 7)}): no "build" entry yet, but only ${Math.round(ageMs / 1000)}s since last update — within the normal grace period, leaving it alone.`);
                  continue;
                }

                // Don't pile on a repair that's already in flight for this branch.
                const { data: runs } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: "build.yml", branch: pr.head.ref, event: "workflow_dispatch", per_page: 10,
                });
                const alreadyRepairing = runs.workflow_runs.some((r) => r.status === "queued" || r.status === "in_progress");
                if (alreadyRepairing) {
                  core.info(`#${pr.number} (${sha.slice(0, 7)}): a repair dispatch is already queued/in progress — not re-dispatching.`);
                  continue;
                }

                core.warning(`#${pr.number} (${sha.slice(0, 7)}): no "build" status/check-run at all after ${Math.round(ageMs / 60000)}m — dispatching a repair build.`);
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: "build.yml", ref: pr.head.ref,
                  inputs: { pr_number: String(pr.number) },
                });
                repaired.push(pr.number);
              } catch (e) {
                errors.push(`#${pr.number}: ${e.message}`);
              }
            }

            core.setOutput("repaired", JSON.stringify(repaired));
            core.setOutput("errors", JSON.stringify(errors));
            if (errors.length) core.setFailed(`Sweep hit ${errors.length} error(s): ${errors.join("; ")}`);
            else core.info(repaired.length ? `Dispatched repair build(s) for: ${repaired.join(", ")}` : "Nothing stuck — every open PR already has a build signal.");
      # LOUD-FAILURE: if the sweep itself can't run (e.g. a permission this token turns out not to
      # have, mirroring the markPullRequestReadyForReview/enablePullRequestAutoMerge FORBIDDEN found
      # in B793696 — that precedent is exactly why this is checked rather than assumed), say so
      # visibly instead of leaving stuck PRs silently un-repaired. Same idempotent-issue pattern as
      # gis-drift.yml / e2e.yml.
      - name: Open or bump a @claude issue if the sweep itself is broken
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "@claude — the **required build-check sweep** (`.github/workflows/build-check-sweep.yml`)",
              "failed, which means a PR whose required \"build\" check never reports at all may now sit",
              "stuck with no automatic repair (the 2026-09-05 NEW-3 outage class — see that workflow's",
              "own header). Check the run log and fix whatever broke (a permission this token turns out",
              "not to have is the most likely cause, per that file's own B793696 precedent).",
              "",
              `Run: ${runUrl}`,
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: "build-check-sweep", per_page: 1 });
            if (open.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body: "⏰ Still failing —\n\n" + body });
            } else {
              await github.rest.issues.create({ owner, repo, title: "🛠️ Required build-check sweep is broken", labels: ["build-check-sweep"], body });
            }
