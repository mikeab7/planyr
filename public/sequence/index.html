/* ── Suggestions queue view ───────────────────────────────────────── */
.sgq{ background:var(--surf); color:var(--txt); font-size:13px; line-height:1.5; }

.sgq .sgq-metacol{ flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.sgq .sgq-date{ font-size:11px; color:#8b949e; white-space:nowrap; }

.sgq .sgq-sel{ font:inherit; font-size:12px; color:var(--txt); background:var(--bg); border:1px solid var(--bd2); border-radius:6px; padding:3px 6px; cursor:pointer; }

.sgq .sgq-actbtn{ cursor:pointer; font:inherit; font-size:12px; font-weight:600; padding:6px 14px; border-radius:7px; border:1px solid transparent; display:inline-flex; align-items:center; gap:6px; transition:.12s; }
.sgq .sgq-actbtn.approve{ background:var(--amber); color:#fff; }

/* ── Review (suggestions redesign) ──────────────────────────────── */
.rev{ display:flex; flex-direction:column; height:100%; background:var(--bg); color:var(--txt); font-size:13px; min-height:0; }

.rev-body{ flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:0; }

/* CURSOR CONVENTION (docs/DESIGN.md "Cursor convention", owner 2026-10-20) — this standalone page never loads src/index.css, so
   it carries its own copy of the stylesheet half: a disabled control shows the ARROW (never pointer, never the forbidden sign;
   !important so an inline `cursor: pointer` on a caller's button cannot survive it), a disabled control that is WORKING
   (aria-busy) shows progress, and every enabled native checkbox / radio / select / range / colour / file input is clickable. */
button:disabled, input:disabled, select:disabled, textarea:disabled, [aria-disabled="true"], label:has(> input:disabled) { cursor: default !important; }
button:disabled[aria-busy="true"], [aria-disabled="true"][aria-busy="true"] { cursor: progress !important; }
input[type="checkbox"]:enabled, input[type="radio"]:enabled, input[type="range"]:enabled, select:enabled, input[type="color"]:enabled, input[type="file"]:enabled { cursor: pointer; }
input[type="range"]:enabled:active { cursor: grabbing; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #b0b7c0; border-radius: 5px; border: 2px solid var(--bg); min-height: 60px; min-width: 60px; }
::-webkit-scrollbar-thumb:hover { background: #6e7680; }
.btn { cursor: pointer; border: 1px solid var(--bd2); background: var(--surf); color: var(--mut);
  padding: 3px 10px; border-radius: 3px; font-size: 11px; font-family: 'Inter', system-ui, sans-serif;
  transition: border-color .15s, color .15s; white-space: nowrap; line-height: 1.6; }
.btn:hover { border-color: var(--amber); color: var(--amber); }
.btn.act { border-color: var(--amber); color: var(--amber); background: #eef2ff; }
.btn.vact { border-color: var(--blue); color: var(--blue); }

/* ── Mobile-only header (≤ 767px). Desktop layout untouched. ── */
@media (max-width: 767px) {
  .app-header {
    display: grid !important;
    grid-template-columns: 1fr auto 1fr;
    grid-template-rows: auto auto;
    gap: 8px 8px !important;
    align-items: center;
    padding: 8px 10px !important;
  }
  /* Row 1 placement */
  .app-header > svg { grid-column: 1; grid-row: 1; justify-self: start; margin-right: 0 !important; }
  .app-header > .hdr-mode { grid-column: 2; grid-row: 1; }
  .app-header > .hdr-actions { grid-column: 3; grid-row: 1; justify-self: end; margin-left: 0 !important; }
  /* Row 2 — only renders in Projects mode */
  .app-header > .hdr-project { grid-column: 1; grid-row: 2; justify-self: start; margin-left: 0 !important; }
  .app-header > .hdr-view { grid-column: 2; grid-row: 2; margin-left: 0 !important; }
  /* Review toggle — explicit placement; un-placed grid items stretch to fill their cell */
  .app-header > .hdr-review { grid-column: 3; grid-row: 2; justify-self: end; margin-left: 0 !important; }
  /* Hide the flex spacer — irrelevant in grid */
  .app-header > div[style*="flex:1"] { display: none !important; }
  /* Hide divider line inside project picker wrap on mobile (no longer needed) */
  .app-header > .hdr-project > div[style*="width:1px"] { display: none !important; }

/* Editors inside grid rows: fit the fixed 24px row exactly — the 36px base
   height is for larger form contexts and overflows/misaligns inside rows */
.drow .ei { height: 24px; border-radius: 0; }
/* NEW-1 (Schedule grid, narrow widths) — the subtle edge on the LAST left-pinned / FIRST right-pinned
   column. A pseudo-element INSIDE the cell (cells clip their overflow), shown only while content is
   actually scrolled underneath, so a table that fits shows no edge at all. */
.pin-edge-l.pin-on::after, .pin-edge-r.pin-on::after { content:""; position:absolute; top:0; bottom:0; width:5px; pointer-events:none; }
.pin-edge-l.pin-on::after { right:0; background:linear-gradient(to left, var(--bd2), transparent); }
.pin-edge-r.pin-on::after { left:0;  background:linear-gradient(to right, var(--bd2), transparent); }
.drow { display: flex; border-bottom: 1px solid var(--bd); border-left: 2px solid transparent;
  position: absolute; left: 0; right: 0; }
/* NEW-1 (row marker, ONE ELEMENT PER ROW — B2584496 amends B2279024 / B2623536) — the hovered / selected row's top + bottom line, AND
   the two grid-line pixels beside it, are painted by ONE element on the ROW (`.drow::after`), above the frozen cells (z-index 6: over
   the sticky ID / Task cells at 5, under the sticky header at 10 and the editors / popovers at 30). It used to be a ::before inside
   each CELL.
   WHY: the marker was already the same colour and position on every cell (measured), but the grid line beside it is each cell's OWN
   border, and a frozen (sticky, opaque) cell rasterises that border differently from a plain one wherever the device pixel ratio is
   fractional — browser zoom 125 / 150 / 175 %. ID and Task read thinner and greyer, Start onward heavier and bluer (owner, Grand Port /
   Groundbreaking Path; ui-audit/verify-grid-row-marker-uniform.mjs measures it). At ratios 1 and 2 the row is already identical, so a
   lower-zoom Chrome shows nothing. One element cannot differ from itself, so the box-shadow re-draws the cells' grid line (var(--bd), the
   same colour) in the one pixel above and the one below the marker: those pixels now come from this element on every cell, frozen or not.
   The marker keeps today's position exactly. It also reaches blank / "+ New task" / review rows and the filler strip without a
   per-cell hook.
   NEW-3 — the HOVER marker only paints while the pointer is the thing driving: the grid sets data-kbnav on its scroll
   container the moment a navigation key is pressed and clears it on the next REAL pointer move, so a parked mouse can never
   keep a second row lit while the arrow keys walk the blue box down the list. (The selected-row marker is not hover.) */
[data-grid-scroll]:not([data-kbnav]) .drow:hover::after,
.drow[data-row-sel]::after,
.drow[data-new-task-row="sel"]::after {
  content:""; position:absolute; left:0; right:0; top:0; bottom:0; pointer-events:none; z-index:6;
  border-top:1px solid #94a3b8; border-bottom:1px solid #94a3b8;
  box-shadow:0 -1px 0 0 var(--bd), 0 1px 0 0 var(--bd); }
/* At a FRACTIONAL device pixel ratio (browser zoom 80 / 125 / 150 / 175 / 250 %) the neighbouring row's own fill edge lands on the pixel
   just past that grid line and is rasterised differently under a frozen cell, so the same band is drawn two pixels deep there. Whole
   ratios (1, 2, 3) keep the single pixel: nothing differs there, so nothing changes. */
@media (max-resolution: 0.95dppx), (min-resolution: 1.05dppx) and (max-resolution: 1.95dppx), (min-resolution: 2.05dppx) and (max-resolution: 2.95dppx) {
  [data-grid-scroll]:not([data-kbnav]) .drow:hover::after,
  .drow[data-row-sel]::after,
  .drow[data-new-task-row="sel"]::after { box-shadow:0 -2px 0 0 var(--bd), 0 2px 0 0 var(--bd); }
}
/* The band depth that clears the neighbouring fill edge is not one number for every ratio (measured, same single-pixel bar): 2px at 80 / 125 /
   175 / 215 / 225 %, 2.5px at 150 % (Windows' own 150 % scaling) and 250 %. An empirical table, re-measured by the harness. */
@media (min-resolution: 1.45dppx) and (max-resolution: 1.55dppx), (min-resolution: 2.45dppx) and (max-resolution: 2.55dppx) {
  [data-grid-scroll]:not([data-kbnav]) .drow:hover::after,
  .drow[data-row-sel]::after,
  .drow[data-new-task-row="sel"]::after { box-shadow:0 -2.5px 0 0 var(--bd), 0 2.5px 0 0 var(--bd); }
}
/* …a row INSIDE a multi-row range keeps only the marker: there the neighbouring row edge is the range's own blue line, and a grid-colour
   line drawn over it would turn it grey (ui-audit/verify-grid-full-lines "the shared row edge is one range-blue line"). */
[data-grid-scroll] .drow:has(> [data-cell-in-range]):is(:hover, [data-row-sel])::after { box-shadow:none; }
/* A full-cell hover-revealed overlay does NOT work here: :hover is true for the ENTIRE mousedown
   (the cursor always enters the row before it can press), so gating pointer-events on :hover still
   swallows every ordinary click on the ID cell — proved live: it silently broke the pre-existing
   row-range-select drag (CHROME-NEVER-EATS-A-PRESS territory, discovered building this feature).
   Fix: the grip is a narrow strip at the cell's edge, not the whole cell, so it never overlaps
   where a click aiming at the row number naturally lands — always interactive, opacity is cosmetic. */
.rowgrip { opacity: .55; transition: opacity .1s; cursor: grab; }
[data-grid-scroll]:not([data-kbnav]) .drow:hover .rowgrip { opacity: 1; }
.rowgrip:active { cursor: grabbing !important; }
/* NEW-1 (task icons, 2026-11-06; amended 2026-11-09, B2671196 ×2) — the icon slot in the Task cell exists ONLY while the task has icons
   (zero width otherwise), and nothing appears on hover: icons are added from the row's right-click menu ("Set icon…"). */
[data-task-icon-slot]:hover { background: rgba(9,105,218,.08); }

.ti-pick-cell { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; position: relative;
  border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--txt); cursor: pointer; padding: 0; }   /* color: currentColor icons (svg:*) draw in the text colour; a <button> does not inherit it */
.ti-pick-cell:hover { background: var(--surf); border-color: var(--bd2); }

/* NEW-ROWMOVE-2BAND — the drag insertion line's leading dot. A plain 2-3px line reads fine at a
   34px row but is easy to lose against 20px-tall grid lines/borders at his actual row height; the
   dot gives the eye one unmistakable anchor at the depth the line starts from, independent of row
   height. Purely decorative (no hit-testing, no pointer-events) — position tracks the line's own
   left edge automatically since the line itself is the positioned ancestor. */
[data-drag-insert-line]::before {

}

/* When embedded in the Planyr shell, the shell's unified header now provides EVERYTHING
   this app's own header did: the Row-1 breadcrumb shows the logo + Dashboard/Projects
   toggle + project switcher (bridged over postMessage, B203), and the shell's Row-2 toolbar
   re-renders the action controls — view switcher, Review, Zoom, Export, Save, Version
   History, Contacts, Automation, Format, Settings — driving THIS app over the postMessage
   toolbar bridge (B388). So hide our own header entirely in-embed, or there'd be a double
   toolbar. (Its self-positioned panels/modals — Settings, Format, etc. — still render; they
   were never anchored to these buttons, so the buttons can live up in the shell.)
   History: B381 narrowed an earlier `.app-header{display:none}` to hide only the duplicated
   nav, because the action toolbar had no shell home yet. Now that the shell hosts the toolbar
   too (B388), hiding the whole header is correct again — the controls didn't vanish, they moved. */
html.in-iframe .app-header { display: none !important; }
/* NEW-3 (Schedule grid, narrow widths) / NEW-1 (empty band) — the shell's floating Help "?" is position:fixed in the
   bottom-right of the WINDOW, i.e. over this iframe's bottom-right corner. It used to be kept off the grid by ending the
   WHOLE page --fab-dock above the window bottom, which left a dead blank band under every view (owner: "the grid body
   stops well short of the bottom"). Now the page fills the window, and each SCROLL surface (grid, Gantt, Task Report)
   carries --fab-dock as scroll-end padding instead, so the last row can always scroll clear of the button while the
   rows use every pixel of height. html[data-corner-free] tells the shell's cornerClearance.js not to lift the button
   for this page's content (nothing here is permanently under it). Standalone (not embedded) the var is 0. */
html.in-iframe { --fab-dock: 48px; }
@media (pointer: coarse) { html.in-iframe { --fab-dock: 64px; } }

<script id="sched-pin-cursor">
// pinSchedCursor(cursor, { onExit }) — the scheduler iframe's own copy of src/shared/ui/controls.jsx `pinDragCursor` (this
// standalone page cannot import from src/). Pins ONE cursor over the whole page for the LIFE of a drag, so it does not flip
// back to whatever the pointer happens to be over (every grid cell / header / Gantt row sets its own inline cursor, and the
// pointer routinely leaves the grip: Snap mode moves the divider away from it). `!important` on the root + every descendant
// beats those inline cursors. Released by the returned function (idempotent), by pointerup / mouseup, and — as an ABORT, which
// also calls `onExit` so the caller can end its own gesture — by pointercancel, Escape and window blur. One pin at a time: a
// second call replaces the first.
(function () {
  var live = null;
  window.pinSchedCursor = function (cursor, opts) {
    if (live) live.release(false);
    var el = document.createElement("style");
    el.setAttribute("data-pinned-cursor", cursor);
    el.textContent = "html, html * { cursor: " + cursor + " !important; }";
    document.head.appendChild(el);
    var onExit = opts && opts.onExit;
    var me = { release: release };
    function onEvent(e) {
      if (e.type === "keydown" && e.key !== "Escape") return;
      release(e.type === "keydown" || e.type === "blur" || e.type === "pointercancel");
    }

      if (live !== me) return;
      live = null;
      el.remove();
      window.removeEventListener("pointerup", onEvent, true);
      window.removeEventListener("mouseup", onEvent, true);
      window.removeEventListener("pointercancel", onEvent, true);
      window.removeEventListener("keydown", onEvent, true);
      window.removeEventListener("blur", onEvent);

    window.addEventListener("pointerup", onEvent, true);
    window.addEventListener("mouseup", onEvent, true);
    window.addEventListener("pointercancel", onEvent, true);
    window.addEventListener("keydown", onEvent, true);
    window.addEventListener("blur", onEvent);
    return function () { release(false); };
  };
})();
